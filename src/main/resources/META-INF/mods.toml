loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''修复 EMI 侧两条「JEI 插件兼容链路」共同缺失的一环：IRecipeLayoutBuilder#addSlotToWidget（JEI 15.10+ 的滚动格控件）。

几个东西的关系：
· JEI 是配方查看器本体，也是插件 API 的提供方；
· EMI 是另一个查看器，本身不认 JEI 插件，靠内置的 JEMI（需要装 JEI）把 JEI 的配方类别转过来；
· TMRV（TooManyRecipeViewers）是另一条兼容链路，自带一份 JEI API，不需要装 JEI。

JEMI 与 TMRV 都把交给滚动格控件的槽位一律丢在 (0, 0)，于是用 IGuiHelper#createScrollGridFactory 排布产出的配方（例如 CrockPot 的猪灵以物易物）在 EMI 里会把所有物品挤在同一个格子上。本模组在两个桥各自的布局器上注入，改为按滚动格的实际位置摆放槽位。

槽位超过一页时：两条链路都会在原滚动条的位置换成上下翻页按钮（支持点击与鼠标滚轮，滚动条本身不再出现），指针在翻页控件或整个槽位区域上都能滚轮翻页。

另外会隐藏 JEI 15.20 起自带的「标签页」类别：EMI 本身就有物品标签信息，两套并存只会让 EMI 多出一串重复的标签页。做法是用 EMI 的公开 API 把这类配方移出 EMI 的显示索引（EmiRegistry#removeRecipes），配方界面里的标签页随之消失。

两条链路互斥、各自独立生效，不需要任何配置。只影响 EMI 上的显示，JEI 自身的界面不受影响；缺哪个桥就只记一条警告并跳过。仅客户端。'''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="emi"
    mandatory=false
    versionRange="[1.1.0,)"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15.10.0,)"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="toomanyrecipeviewers"
    mandatory=false
    versionRange="[0.9.0,)"
    ordering="NONE"
    side="CLIENT"
